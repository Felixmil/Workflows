name: Update renv snapshot and check package

on:
  workflow_call:
    inputs:
      app-id:
        type: string
        required: true
      os-matrix:
        description: 'JSON array of OS names for the test matrix. Defaults to all three platforms.'
        required: false
        type: string
        default: >-
          ["${{ vars.GHA_DEFAULT_RUNNER_WINDOWS || 'windows-latest' }}",
          "${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-latest' }}",
          "${{ vars.GHA_DEFAULT_RUNNER_MACOS || 'macos-latest' }}"]
      extra-repositories:
        description: 'Extra CRAN-like repositories to add to getOption("repos") (e.g. an R-universe such as https://open-systems-pharmacology.r-universe.dev, so renv and pak can resolve dependencies from prebuilt binaries). Comma/space-separated, or one URL per line. Used both when snapshotting the lockfile and when checking the package.'
        required: false
        type: string
        default: ''
    secrets:
      private-key:
        required: true

jobs:
  update-renv-lock:
    runs-on: ${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-latest' }}
    name: Update renv.lock
    env:
      GITHUB_PAT: ${{ github.token }}
    outputs:
      lockfile-changed: ${{ steps.check-changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: ${{ inputs.extra-repositories }}

      # setup-r exports RENV_CONFIG_REPOS_OVERRIDE (public RSPM only), and renv
      # then ignores every other repository. Packages that only exist on extra
      # repositories (e.g. an R-universe) are reported as "not available". The
      # R steps below drop the override so renv uses the repositories recorded
      # in renv.lock, plus extra-repositories. Packages listed in the
      # DESCRIPTION Remotes field are still installed from their remote.
      - name: Upgrade renv
        shell: Rscript {0}
        run: |
          Sys.unsetenv("RENV_CONFIG_REPOS_OVERRIDE")
          install.packages("renv")
          # Updates the renv record in renv.lock and renv/activate.R when a
          # newer renv is available. Projects without renv/activate.R do not
          # load renv on startup, so leave them without one.
          if (file.exists("renv/activate.R")) {
            renv::upgrade(prompt = FALSE)
          }

      # A separate R session, so that the upgraded renv is the one loaded.
      - name: Update project dependencies and snapshot lockfile
        shell: Rscript {0}
        env:
          EXTRA_REPOSITORIES: ${{ inputs.extra-repositories }}
        run: |
          Sys.unsetenv("RENV_CONFIG_REPOS_OVERRIDE")
          # When the project loads, renv replaces the repos option with the
          # repositories in renv.lock. Add the extra repositories missing from
          # it, so dependencies that only exist there can be found.
          extra <- strsplit(Sys.getenv("EXTRA_REPOSITORIES"), "[[:space:],]+")[[1]]
          extra <- sub("/+$", "", extra[nzchar(extra)])
          repos <- getOption("repos")
          extra <- setdiff(extra, sub("/+$", "", repos))
          options(repos = c(repos, stats::setNames(extra, extra)))
          renv::install(prompt = FALSE, lock = TRUE)

      - name: Check if renv.lock or renv/activate.R changed
        id: check-changes
        run: |
          if [ -z "$(git status --porcelain -- renv.lock renv/activate.R)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "renv.lock and renv/activate.R are unchanged, skipping downstream jobs."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "renv.lock or renv/activate.R has been updated."
            git diff renv.lock renv/activate.R
          fi

      - name: Upload updated renv files
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: renv-lock
          path: |
            renv.lock
            renv/activate.R
          retention-days: 1

  test-on-platforms:
    needs: update-renv-lock
    if: needs.update-renv-lock.outputs.lockfile-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    runs-on: ${{ matrix.os }}
    name: Test on ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download updated renv files
        uses: actions/download-artifact@v8
        with:
          name: renv-lock
          path: .

      - name: Setup R environment
        uses: Open-Systems-Pharmacology/Workflows/.github/actions/setup-r-env@main
        with:
          setup-pandoc: 'true'
          extra-repositories: ${{ inputs.extra-repositories }}
          extra-packages: |
            rcmdcheck

      - name: Check R package
        uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--no-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: 'c("error")'

  commit-renv-lock:
    needs: [update-renv-lock, test-on-platforms]
    runs-on: ${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-latest' }}
    if: needs.update-renv-lock.outputs.lockfile-changed == 'true' && needs.test-on-platforms.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Generate token from GitHub App
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Download updated renv files
        uses: actions/download-artifact@v8
        with:
          name: renv-lock
          path: .

      - name: Commit renv files if changed
        uses: EndBug/add-and-commit@v9
        with:
          message: '🤖 Update renv.lock [skip actions]'
          default_author: github_actions
          add: 'renv.lock renv/activate.R'
